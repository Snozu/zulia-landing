server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        image/svg+xml;

    etag on;

    # nginx vive detrás de Traefik, que termina el TLS, así que aquí solo se ve
    # http. Sin esto los 301 salen con esquema absoluto http:// y cada uno se
    # convierte en una cadena de dos saltos hasta https.
    absolute_redirect off;

    # SEO and discovery files must never fall through to the homepage.
    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms-full.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # nginx no siempre trae el tipo MIME de .webmanifest en mime.types y sin el
    # correcto Chrome ignora el manifiesto.
    location = /site.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* ^/(?:sitemap-index|sitemap-[0-9]+)\.xml$ {
        try_files $uri =404;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /b10db6fccd430f3cff69c9bf5f668cda.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    # URLs de servicio antiguas: 301 real en el servidor. Astro genera para
    # ellas una página con meta-refresh, que responde 200 y hace que el enlace
    # entrante pierda fuerza en el salto. Estas reglas van antes del catch-all.
    location = /servicios/desarrollo-software-a-medida/ { return 301 /servicios/software-a-medida/; }
    location = /servicios/agentes-inteligencia-artificial/ { return 301 /servicios/capa-agentica/; }
    location = /servicios/automatizacion-procesos/ { return 301 /servicios/capa-agentica/; }
    location = /servicios/landing-pages-seo/ { return 301 /servicios/sitios-y-catalogos/; }
    location = /servicios/consultoria-arquitectura-tecnologica/ { return 301 /servicios/ingenieria-con-ia/; }

    # HTML is revalidated so new deployments appear immediately. Unknown URLs
    # return a real 404 instead of creating crawlable soft-404 duplicates.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Astro fingerprints these assets, so they can be cached permanently.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Las imagenes para compartir cambian de contenido sin cambiar de nombre, y
    # con el cache de 30 dias de abajo WhatsApp y Facebook siguen mostrando la
    # anterior. Solo las lee un scraper de vez en cuando, asi que una hora no
    # cuesta nada. Va como prefijo ^~ para ganarle a la regla por extension.
    location ^~ /og/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        access_log off;
    }

    # Public media keeps stable names and receives a conservative cache.
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Página 404 propia. Se sirve con el status 404 real (no 200), para que
    # Google la trate como error y no como contenido indexable.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
