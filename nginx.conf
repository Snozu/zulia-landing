server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/ld+json
        application/xml
        image/svg+xml;

    etag on;

    # SEO and discovery files must never fall through to the homepage.
    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms-full.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* ^/(?:sitemap-index|sitemap-[0-9]+)\.xml$ {
        try_files $uri =404;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /b10db6fccd430f3cff69c9bf5f668cda.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML is revalidated so new deployments appear immediately. Unknown URLs
    # return a real 404 instead of creating crawlable soft-404 duplicates.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Astro fingerprints these assets, so they can be cached permanently.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public media keeps stable names and receives a conservative cache.
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Página 404 propia. Se sirve con el status 404 real (no 200), para que
    # Google la trate como error y no como contenido indexable.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
