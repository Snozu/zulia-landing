/* Paleta tomada de src/styles/global.css. Los nombres son los de las
   variables del sitio para que se note de dónde sale cada color. */
const STAGE='#0e1013', LINEA='rgba(255,255,255,.12)', PANEL='rgba(255,255,255,.04)';
const TEXTO='#f2f3f5', MUTED='#9da5b0', ORDINAL='#7d848f';
const AZUL='#2f6bff', AZUL_LUZ='#5a8dff', VERDE='#24b879';
/* Único color fuera del sistema del sitio: hace falta un tono de "esto ahora
   cuesta" y la paleta no tiene ninguno. Se usa solo en redes. */
const COSTO='#e0a33a';

const SANS='Onest', MONO='"JetBrains Mono"';
const PAD = 36;                   // aire interior de los paneles
const MAY = f => f*0.72;          // altura de mayúscula aproximada
const DESC = f => f*0.21;         // descendente

function fondo(ctx,W,H){
  ctx.fillStyle=STAGE; ctx.fillRect(0,0,W,H);
  // Mismo resplandor que .escenario: 80rem x 40rem al 20% -10%, y al .22.
  const rx=W*1.185, ry=rx*0.5, cx=W*0.20, cy=-H*0.10;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(0,0,0,0,0,rx);
  g.addColorStop(0,'rgba(45,106,245,.22)'); g.addColorStop(.6,'rgba(45,106,245,0)');
  ctx.fillStyle=g; ctx.fillRect(-rx,-rx,rx*2,rx*2); ctx.restore();
}

// Sello de verificado: disco sólido con la palomita calada. Como elemento
// deliberado se lee mucho mejor que un glifo gigante a medio salir del lienzo.
function sello(ctx,cx,cy,d,colorDisco,colorPalomita){
  ctx.fillStyle=colorDisco; ctx.beginPath(); ctx.arc(cx,cy,d/2,0,Math.PI*2); ctx.fill();
  icono(ctx,'palomita',cx-d*0.30,cy-d*0.24,d*0.60,colorPalomita);
}

/* ---- Volumen ----
   Canvas soporta ctx.filter, sombras con color y degradados, que es todo lo
   que hace falta para construir profundidad sin renders externos. */

// Mancha de luz desenfocada: da atmósfera al fondo.
function resplandorSuave(ctx,x,y,r,color,alfa=1){
  ctx.save();
  ctx.filter=`blur(${Math.round(r*0.30)}px)`;
  ctx.globalAlpha=alfa;
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function fondoProfundo(ctx,W,H){
  const g=ctx.createLinearGradient(0,0,W*0.6,H);
  g.addColorStop(0,'#0b1330'); g.addColorStop(.55,'#070d20'); g.addColorStop(1,'#05091a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  resplandorSuave(ctx,W*0.78,H*0.16,W*0.62,'rgba(47,107,255,.85)',.55);
  resplandorSuave(ctx,W*0.10,H*0.74,W*0.52,'rgba(30,70,200,.75)',.42);
  resplandorSuave(ctx,W*0.55,H*0.46,W*0.34,'rgba(120,160,255,.5)',.22);
}

/* Baldosa con volumen: degradado diagonal, sombra de color, filo de luz
   arriba y un especular en la mitad superior. Es lo que hace que un icono
   plano se lea como objeto. */
function baldosa(ctx,cx,cy,tam,ico,{giro=0,claro='#7ba4ff',oscuro='#1637b8',brillo='rgba(47,107,255,.85)'}={}){
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(giro*Math.PI/180);
  const h=tam, r=tam*0.26;
  ctx.shadowColor=brillo; ctx.shadowBlur=tam*0.62; ctx.shadowOffsetY=tam*0.18;
  const g=ctx.createLinearGradient(-h/2,-h/2,h/2,h/2);
  g.addColorStop(0,claro); g.addColorStop(1,oscuro);
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-h/2,-h/2,h,h,r); ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  const esp=ctx.createLinearGradient(0,-h/2,0,h*0.08);
  esp.addColorStop(0,'rgba(255,255,255,.42)'); esp.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=esp; ctx.beginPath(); ctx.roundRect(-h/2+2,-h/2+2,h-4,h*0.56,r*0.92); ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,.42)'; ctx.lineWidth=Math.max(1.2,tam*0.011);
  ctx.beginPath(); ctx.roundRect(-h/2+1,-h/2+1,h-2,h-2,r); ctx.stroke();

  icono(ctx,ico,-tam*0.27,-tam*0.27,tam*0.54,'#fff');
  ctx.restore();
}

// Panel de vidrio: relleno translúcido, degradado de luz y filo claro.
function vidrio(ctx,x,y,w,h,r=26){
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.09)';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(255,255,255,.20)'); g.addColorStop(.55,'rgba(255,255,255,.02)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.roundRect(x+.8,y+.8,w-1.6,h-1.6,r); ctx.stroke();
  ctx.restore();
}

function girado(ctx,cx,cy,grados,dibujar){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(grados*Math.PI/180); ctx.translate(-cx,-cy);
  dibujar(); ctx.restore();
}

function pastillaIcono(ctx,txt,x,y,{ico=null,fondo='#fff',color=AZUL,f=26,giro=0}={}){
  const ls=f*0.04, tw=ancho(ctx,txt,`600 ${f}px ${SANS}`,ls);
  const h=f*2.15, padX=f*0.78, icoTam=f*1.05;
  const w=tw+padX*2+(ico?icoTam+f*0.42:0);
  girado(ctx,x+w/2,y+h/2,giro,()=>{
    ctx.fillStyle=fondo; ctx.beginPath(); ctx.roundRect(x,y,w,h,h/2); ctx.fill();
    let cx=x+padX;
    if(ico){ icono(ctx,ico,cx,y+(h-icoTam)/2,icoTam,color); cx+=icoTam+f*0.42; }
    texto(ctx,txt,cx,y+(h+MAY(f))/2,9999,h,`600 ${f}px ${SANS}`,color,ls);
  });
  return w;
}

function botonCirculo(ctx,ico,cx,cy,d,fondo,color){
  ctx.fillStyle=fondo; ctx.beginPath(); ctx.arc(cx,cy,d/2,0,Math.PI*2); ctx.fill();
  icono(ctx,ico,cx-d*0.27,cy-d*0.27,d*0.54,color);
}

// Resalta una palabra dentro de una línea ya dibujada.
function resaltado(ctx,x,yBase,txt,f,font,color,radio=10){
  const w=ancho(ctx,txt,font);
  const arriba=f*0.15, abajo=DESC(f)+f*0.07;
  ctx.fillStyle=color; ctx.beginPath();
  ctx.roundRect(x-f*0.12,yBase-MAY(f)-arriba,w+f*0.24,MAY(f)+arriba+abajo,radio); ctx.fill();
}

function tarjetaGirada(ctx,x,y,w,h,giro,dibujar){
  girado(ctx,x+w/2,y+h/2,giro,()=>{
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.roundRect(x,y,w,h,18); ctx.fill();
    dibujar();
  });
}

function fondoColor(ctx,W,H,color){
  ctx.fillStyle=color; ctx.fillRect(0,0,W,H);
}

// Devuelve la y de la línea base siguiente para encadenar bloques sin medir.
function texto(ctx,txt,x,y,maxW,lh,font,color,ls=0){
  ctx.font=font; ctx.fillStyle=color; ctx.textBaseline='alphabetic';
  const escribir=(s,yy)=>{
    if(!ls){ctx.fillText(s,x,yy);return;}
    let cx=x; for(const ch of s){ctx.fillText(ch,cx,yy); cx+=ctx.measureText(ch).width+ls;}
  };
  const anchoDe=(s)=> ls? [...s].reduce((a,c)=>a+ctx.measureText(c).width+ls,0)-ls : ctx.measureText(s).width;
  const palabras=txt.split(' '); let linea=''; let yy=y;
  for(const p of palabras){
    const prueba=linea?linea+' '+p:p;
    if(anchoDe(prueba)>maxW && linea){ escribir(linea,yy); yy+=lh; linea=p; }
    else linea=prueba;
  }
  escribir(linea,yy);
  return yy+lh;
}

function contarLineas(ctx,txt,maxW,font){
  ctx.font=font;
  let linea='', n=1;
  for(const p of txt.split(' ')){
    const prueba=linea?linea+' '+p:p;
    if(ctx.measureText(prueba).width>maxW && linea){ n++; linea=p; } else linea=prueba;
  }
  return n;
}

// Panel con antetítulo en mono y un párrafo debajo; el alto sale del contenido.
function panelTexto(ctx,x,y,w,rot,cuerpo,colorRot=AZUL_LUZ,fRot=22,fCuerpo=31,lh=46){
  const fC=`500 ${fCuerpo}px ${SANS}`;
  const lineas=contarLineas(ctx,cuerpo,w-PAD*2,fC);
  const bRot=PAD+MAY(fRot);
  const bCue=bRot+DESC(fRot)+24+MAY(fCuerpo);
  const alto=Math.round(bCue+(lineas-1)*lh+DESC(fCuerpo)+PAD);
  panel(ctx,x,y,w,alto);
  rotulo(ctx,rot,x+PAD,y+bRot,fRot,colorRot);
  texto(ctx,cuerpo,x+PAD,y+bCue,w-PAD*2,lh,fC,TEXTO);
  return y+alto;
}

function anchoBalanceado(ctx,txt,maxW,font){
  const n=contarLineas(ctx,txt,maxW,font);
  if(n<=1) return maxW;
  let bajo=0, alto=maxW;
  for(let i=0;i<24;i++){
    const medio=(bajo+alto)/2;
    if(contarLineas(ctx,txt,medio,font)<=n) alto=medio; else bajo=medio;
  }
  return alto;
}

function textoCentroBalanceado(ctx,txt,cx,y,maxW,lh,font,color,ls=0){
  return textoCentro(ctx,txt,cx,y,anchoBalanceado(ctx,txt,maxW,font),lh,font,color,ls);
}

function textoCentro(ctx,txt,cx,y,maxW,lh,font,color,ls=0){
  ctx.font=font;
  const palabras=txt.split(' '); const lineas=[]; let linea='';
  const medir=(t)=> ls? [...t].reduce((a,c)=>a+ctx.measureText(c).width+ls,0)-ls : ctx.measureText(t).width;
  for(const p of palabras){
    const prueba=linea?linea+' '+p:p;
    if(medir(prueba)>maxW && linea){ lineas.push(linea); linea=p; } else linea=prueba;
  }
  lineas.push(linea);
  let yy=y;
  for(const l of lineas){ texto(ctx,l,cx-medir(l)/2,yy,9999,lh,font,color,ls); yy+=lh; }
  return yy;
}

function ancho(ctx,txt,font,ls=0){
  ctx.font=font;
  return ls ? [...txt].reduce((a,c)=>a+ctx.measureText(c).width+ls,0)-ls : ctx.measureText(txt).width;
}

function rotulo(ctx,txt,x,y,f,color){        // versalitas en mono, como el sitio
  return texto(ctx,txt,x,y,9999,f*1.6,`700 ${f}px ${MONO}`,color,f*0.12);
}

function filete(ctx,x1,y,x2,color=LINEA){
  ctx.strokeStyle=color; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x1,y+.5); ctx.lineTo(x2,y+.5); ctx.stroke();
}

/* Los iconos del sitio son glifos sólidos que siguen al color del texto, sin
   contenedor. Aquí igual: nada de cuadros con fondo. */
function icono(ctx,clave,x,y,tam,color){
  ctx.save(); ctx.translate(x,y); ctx.scale(tam/256,tam/256);
  ctx.fillStyle=color; ctx.fill(new Path2D(ICONOS[clave]));
  ctx.restore();
}

function panel(ctx,x,y,w,h,r=20,cara=PANEL,borde=LINEA){
  ctx.fillStyle=cara; ctx.strokeStyle=borde; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x+.5,y+.5,w-1,h-1,r); ctx.fill(); ctx.stroke();
}

// Etiqueta de estado: filete y versalitas, no una pastilla rellena.
function etiqueta(ctx,txt,x,y,color,f=22){
  const w=ancho(ctx,txt,`700 ${f}px ${MONO}`,f*0.12), padX=f*0.8, h=f*2;
  ctx.strokeStyle=color; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(x+.5,y+.5,w+padX*2,h,6); ctx.stroke();
  texto(ctx,txt,x+padX,y+(h+MAY(f))/2,9999,h,`700 ${f}px ${MONO}`,color,f*0.12);
  return w+padX*2;
}

function marca(ctx,x,y,tam=50){
  ctx.font=`700 ${tam*0.78}px ${SANS}`; ctx.textBaseline='alphabetic';
  const yb=y+MAY(tam);
  ctx.fillStyle=TEXTO; ctx.fillText('Zul',x,yb);
  ctx.fillStyle=AZUL_LUZ; ctx.fillText('IA',x+ctx.measureText('Zul').width,yb);
}

/* Cabecera y pie comunes. El folio en mono sustituye a la barra de progreso:
   dice lo mismo y se parece al resto de la marca. */
function cabecera(ctx,W,m,ante,n,total){
  rotulo(ctx,ante,m,132,24,AZUL);
  if(n){
    const f=`700 24px ${MONO}`, t=`${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
    texto(ctx,t,W-m-ancho(ctx,t,f,2.4),132,9999,40,f,ORDINAL,2.4);
  }
  filete(ctx,m,168,W-m);
}

function pie(ctx,W,H,m,derecha){
  filete(ctx,m,H-172,W-m);
  marca(ctx,m,H-138,50);
  if(derecha){
    const f=`500 26px ${MONO}`;
    texto(ctx,derecha,W-m-ancho(ctx,derecha,f),H-100,9999,40,f,ORDINAL);
  }
}

const IMG={};
async function cargarImagenes(rutas){
  await Promise.all(Object.entries(rutas).map(([k,src])=>new Promise((ok,fallo)=>{
    const i=new Image(); i.onload=()=>{IMG[k]=i;ok();}; i.onerror=fallo; i.src=src;
  })));
}

// Dibuja una imagen a un ancho dado, conservando su proporción.
function imagen(ctx,clave,x,y,ancho){
  const i=IMG[clave];
  ctx.drawImage(i,x,y,ancho,ancho*i.naturalHeight/i.naturalWidth);
}
